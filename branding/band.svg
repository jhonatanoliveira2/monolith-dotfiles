<?xml version="1.0" encoding="UTF-8"?>
<!-- Light sweep band (one frame; @Y@ = vertical position). build.sh clips it to the snowflake's shape. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="-18" width="160" height="36" fill="url(#band)" transform="translate(0 @Y@) skewY(-20)"/>
</svg>
