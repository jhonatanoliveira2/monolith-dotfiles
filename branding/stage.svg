<?xml version="1.0" encoding="UTF-8"?>
<!-- MONOLITH boot mark, stage layer: the lit horizon the NixOS snowflake stands above (160 x 200, the mark's
     canvas). branding/build.sh renders it and composes the snowflake (nixos-icons) and the light sweep on top. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <defs>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="80" cy="184" rx="74" ry="9" fill="url(#glow)"/>
  <rect x="0" y="183.5" width="160" height="1" fill="url(#horizon)"/>
</svg>
