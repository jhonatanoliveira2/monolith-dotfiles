<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="MONOLITH logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b2f36"/>
      <stop offset="1" stop-color="#1b1e23"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7df9ff"/>
      <stop offset="1" stop-color="#00b8d4"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="40" fill="#101215"/>
  <!-- ground line -->
  <rect x="40" y="206" width="176" height="2" fill="#3a3f47"/>
  <!-- monolith slab (1:4:9) -->
  <rect x="94" y="36" width="68" height="170" fill="url(#face)"/>
  <!-- cyan edge light -->
  <rect x="162" y="36" width="4" height="170" fill="url(#edge)"/>
  <rect x="94" y="36" width="72" height="3" fill="#7df9ff"/>
  <!-- soft reflection -->
  <rect x="94" y="208" width="68" height="14" fill="#00e5ff" opacity="0.10"/>
</svg>
