# MONOLITH Nothing theme: Ghostty values on top of ~/.config/ghostty/config.ghostty, which reads this file as
# ~/.config/ghostty/nothing.ghostty (config-file = ?nothing.ghostty). Installed by scripts/nothing-theme.sh on
# Arch / CachyOS and by Home Manager on NixOS while the theme is on; removed when it is turned off.
background-opacity = 0.8
