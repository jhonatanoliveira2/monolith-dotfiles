# cava in the MONOLITH Nothing theme: thin bars in greys, from the off-LED grey at the bottom to white at the
# top (monochrome, like the shell). Written by the Home Manager module (programs.monolith.nothingTheme.cava).
# The shell's own spectrum (lyrics widget) draws LEDs and does not use this file.

[general]
framerate = 60
bar_width = 1
bar_spacing = 1
sleep_timer = 5

[input]
method = pipewire

[output]
method = ncurses
orientation = bottom

[color]
background = default
gradient = 1
gradient_color_1 = '#333333'
gradient_color_2 = '#7a7a7a'
gradient_color_3 = '#a3a3a3'
gradient_color_4 = '#d4d4d4'
gradient_color_5 = '#f2f2f2'
gradient_color_6 = '#ffffff'

[smoothing]
noise_reduction = 77
monstercat = 1
