# MONOLITH: which xdg-desktop-portal backend answers each request in the Hyprland session
# (XDG_CURRENT_DESKTOP=Hyprland, so this file wins over /usr/share and /etc/xdg ones).
# Takes effect on the next login (or: systemctl --user restart xdg-desktop-portal).
#
# One file chooser everywhere: browsers (Chromium and Electron apps use the portal on their own; Firefox and
# Zen with widget.use-xdg-desktop-portal.file-picker = 1 in about:config), Flatpak apps and the shell itself
# (Settings > Profile > Choose runs zenity through the portal) all open the GTK dialog of
# xdg-desktop-portal-gtk. Screen sharing and screenshots stay with xdg-desktop-portal-hyprland.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
