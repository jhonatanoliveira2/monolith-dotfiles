# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock

$font = JetBrainsMono Nerd Font

# COLOURS AND TEXTS: the shell writes generated/lock-theme.conf from Settings > Themes and the
# language (services/Themes.qml); these defaults (the Monolith palette) apply while it does not exist.
$lock_text = rgba(eeeeeeff)
$lock_time = rgba(ffffffff)
$lock_date = rgba(ccccccff)
$lock_layout = rgba(888888ff)
$lock_inner = rgba(11111126)
$lock_line = rgba(c8c8c840)
$lock_check = rgba(ffffffff)
$lock_fail = rgba(e06c75ff)
$lock_caps = rgba(e5c07bff)
$lock_txt_password = Senha
$lock_txt_caps = Caps Lock ativado
source = ~/.config/hypr/generated/lock-theme.conf

general {
    hide_cursor = false
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 5
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 1
    inner_color = $lock_inner

    outer_color = $lock_line
    check_color = $lock_check
    fail_color = $lock_fail
    capslock_color = $lock_caps

    font_color = $lock_text
    fade_on_empty = false
    rounding = 0

    font_family = $font
    placeholder_text = 󰌾  $lock_txt_password
    fail_text = $PAMFAIL$FPRINTFAIL

    # check_text = Authenticating...
    # dots_text_format = *
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, 0
    halign = center
    valign = center
}

# CAPS LOCK (empty while it is off)
label {
    monitor =
    text = cmd[update:250] ~/.config/hypr/scripts/caps-lock.sh "󰪛  $lock_txt_caps"
    font_size = 12
    font_family = $font
    color = $lock_caps
    position = 0, -50
    halign = center
    valign = center
}

# PROFILE: picture and name from the shell (Settings > Profile). The files only exist while
# "Show on the lock screen" is on; without them nothing is drawn here.
image {
    monitor =
    path = ~/.config/hypr/generated/lock-avatar.png
    size = 110
    rounding = -1
    border_size = 0
    position = 0, 150
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:0] cat "$HOME/.config/hypr/generated/lock-name" 2>/dev/null
    font_size = 18
    font_family = $font
    color = $lock_time
    position = 0, 72
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 60
    font_family = $font
    color = $lock_time
    position = 0, -130
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 16
    font_family = $font
    color = $lock_date

    position = 0, -250
    halign = center
    valign = top
}

# KEYBOARD LAYOUT
label {
    monitor =
    text = $LAYOUT[en,ru]
    font_size = 14
    font_family = $font
    onclick = hyprctl switchxkblayout all next
    color = $lock_layout
    position = 0, -85
    halign = center
    valign = center
}

# NOW PLAYING - título (update em ms; 500 = 2x por segundo)
label {
    text = cmd[update:500] ~/.config/hypr/scripts/now-playing.sh

    position = 0, -300
    halign = center
    valign = center

    font_size = 15
    color = $lock_date
}

# PREVIOUS
label {
    text = cmd[update:500] ~/.config/hypr/scripts/now-playing.sh previous

    position = -40, -370
    halign = center
    valign = center
    font_size = 28
    onclick = ~/.config/hypr/scripts/now-playing.sh ctl previous
    color = $lock_date
}

# PLAY / PAUSE
label {
    text = cmd[update:500] ~/.config/hypr/scripts/now-playing.sh pause

    position = 0, -370
    halign = center
    valign = center
    font_size = 28
    onclick = ~/.config/hypr/scripts/now-playing.sh ctl play-pause
    color = $lock_date
}

# NEXT
label {
    text = cmd[update:500] ~/.config/hypr/scripts/now-playing.sh next

    position = 40, -370
    halign = center
    valign = center
    font_size = 28
    onclick = ~/.config/hypr/scripts/now-playing.sh ctl next
    color = $lock_date
}

# SESSION: reboot and power off (icons only: hyprlock has no hover events for a tooltip)
label {
    monitor =
    text = 󰜉
    font_size = 18
    font_family = $font
    color = $lock_date
    onclick = systemctl reboot
    position = -78, 30
    halign = right
    valign = bottom
}
label {
    monitor =
    text = 󰐥
    font_size = 18
    font_family = $font
    color = $lock_date
    onclick = systemctl poweroff
    position = -30, 30
    halign = right
    valign = bottom
}
