general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
    inhibit_sleep = 3
}

# 10 min: lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 30 min: displays off (back on with any input)
listener {
    timeout = 1800
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# 1 h: suspend
listener {
    timeout = 3600
    on-timeout = systemctl suspend
}

# 2 h: power off. A suspended machine does not count idle time, so this only fires when the suspend
# above did not happen (blocked by an inhibitor, e.g. media playing or an app holding a sleep lock).
listener {
    timeout = 7200
    on-timeout = systemctl poweroff
}
